name: Build and publish woodtapper on PyPI

on:
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine 

      - name: Build package
        run: |
          python -m build 

      - name: Upload to PyPI
        if: github.event.release.target_commitish == 'main' && env.PYPI_API_TOKEN != ''
        run: |
          twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ env.PYPI_API_TOKEN }}

      - name: Skip PyPI upload when token is unavailable
        if: github.event.release.target_commitish == 'main' && env.PYPI_API_TOKEN == ''
        run: echo "PYPI_API_TOKEN is not configured; skipping PyPI upload."